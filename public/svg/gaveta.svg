
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="56" viewBox="0 0 260 56">
  <defs>
    <!-- Madeira escura e envelhecida -->
    <linearGradient id="drawerWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60452f"/>
      <stop offset=".18" stop-color="#523923"/>
      <stop offset=".52" stop-color="#49301e"/>
      <stop offset="1" stop-color="#302015"/>
    </linearGradient>

    <linearGradient id="drawerInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c291b"/>
      <stop offset=".5" stop-color="#4b3321"/>
      <stop offset="1" stop-color="#352316"/>
    </linearGradient>

    <linearGradient id="drawerEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#846143"/>
      <stop offset=".25" stop-color="#62452e"/>
      <stop offset="1" stop-color="#392619"/>
    </linearGradient>

    <!-- Latão antigo -->
    <linearGradient id="oldBrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6a361"/>
      <stop offset=".35" stop-color="#8d6c37"/>
      <stop offset=".7" stop-color="#705127"/>
      <stop offset="1" stop-color="#49351e"/>
    </linearGradient>

    <!-- Metal gasto do cadeado -->
    <linearGradient id="oldLock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0bda9"/>
      <stop offset=".35" stop-color="#888a83"/>
      <stop offset=".7" stop-color="#626760"/>
      <stop offset="1" stop-color="#3e4342"/>
    </linearGradient>

    <linearGradient id="shackle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#535955"/>
      <stop offset=".35" stop-color="#c2bfa9"/>
      <stop offset=".65" stop-color="#8b8b7b"/>
      <stop offset="1" stop-color="#444943"/>
    </linearGradient>

    <filter id="drawerShadow" x="-10%" y="-30%" width="120%" height="170%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Sombra projetada -->
  <rect x="7" y="8" width="248" height="45" rx="3"
        fill="#000" opacity=".42" filter="url(#drawerShadow)"/>

  <!-- Corpo frontal da gaveta -->
  <rect x="4" y="4" width="252" height="48" rx="3"
        fill="url(#drawerWood)" stroke="#281b12" stroke-width="1.2"/>

  <!-- Borda superior de madeira -->
  <path d="M7 5.5H253" stroke="#a17a51"
        stroke-opacity=".65" stroke-width="1.2"/>

  <!-- Veios discretos da madeira -->
  <g fill="none" stroke-linecap="round">
    <path d="M9 10C35 8 48 12 73 10S115 9 143 11"
          stroke="#b18a5d" stroke-opacity=".18" stroke-width="1"/>
    <path d="M11 14C34 13 48 16 69 14"
          stroke="#21170f" stroke-opacity=".35" stroke-width="1"/>
    <path d="M153 10C177 12 199 9 223 11S242 10 250 12"
          stroke="#b18a5d" stroke-opacity=".13" stroke-width="1"/>
    <path d="M10 47C45 45 72 48 102 46"
          stroke="#1b120c" stroke-opacity=".45" stroke-width="1"/>
    <path d="M158 47C187 45 215 48 250 46"
          stroke="#1b120c" stroke-opacity=".4" stroke-width="1"/>
    <path d="M20 19l17-.5m35 1l11-.5m91 0l13 .5m22-1l16 .5"
          stroke="#d0a878" stroke-opacity=".12" stroke-width=".7"/>
  </g>

  <!-- Moldura rebaixada da gaveta -->
  <rect x="12" y="10" width="236" height="35" rx="2"
        fill="url(#drawerInner)" stroke="#2b1c12" stroke-width="1.3"/>

  <rect x="14" y="12" width="232" height="31" rx="1.5"
        fill="none" stroke="#98714a" stroke-opacity=".45" stroke-width=".8"/>

  <path d="M15 12.5H245"
        stroke="#d1aa78" stroke-opacity=".2" stroke-width=".7"/>

  <path d="M15 42.5H245"
        stroke="#100b08" stroke-opacity=".65" stroke-width="1"/>

  <!-- Desgaste nas bordas -->
  <g fill="none" stroke-linecap="round">
    <path d="M17 11l8 .3m-3 1.4l5-.2"
          stroke="#c09a6b" stroke-opacity=".4" stroke-width=".7"/>
    <path d="M236 13l6-.5m-5 2l3-.3"
          stroke="#b18b5e" stroke-opacity=".35" stroke-width=".7"/>
    <path d="M19 43l12-.5m-8 1.2l5-.2"
          stroke="#b18b5e" stroke-opacity=".25" stroke-width=".7"/>
    <path d="M229 43l10-.6"
          stroke="#b18b5e" stroke-opacity=".22" stroke-width=".7"/>
  </g>

  <!-- Chapa de fixação antiga -->
  <rect x="106" y="14" width="48" height="8" rx="1.5"
        fill="url(#oldBrass)" stroke="#46331d" stroke-width=".8"/>

  <path d="M109 15.5H151"
        stroke="#ead29a" stroke-opacity=".45" stroke-width=".8"/>

  <circle cx="110" cy="18" r=".8" fill="#4d3921"/>
  <circle cx="150" cy="18" r=".8" fill="#4d3921"/>

  <!-- Arco metálico do cadeado -->
  <path d="M123 24V18.5C123 13.2 126 11 130 11
           C134 11 137 13.2 137 18.5V24"
        fill="none" stroke="#292c29" stroke-width="4.2"
        stroke-linecap="round"/>

  <path d="M123 23V18.5C123 13.8 126 12 130 12
           C134 12 137 13.8 137 18.5V23"
        fill="none" stroke="url(#shackle)" stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- Corpo do cadeado -->
  <rect x="116" y="21" width="28" height="23" rx="3"
        fill="#202321" opacity=".5"/>

  <rect x="116" y="20" width="28" height="23" rx="3"
        fill="url(#oldLock)" stroke="#292c29" stroke-width="1"/>

  <!-- Brilho gasto na borda -->
  <path d="M119 21.5H141"
        stroke="#e0d7bc" stroke-opacity=".55" stroke-width=".8"/>

  <path d="M117 24V39"
        stroke="#d5d1bc" stroke-opacity=".22" stroke-width=".8"/>

  <!-- Quatro discos da combinação -->
  <g>
    <rect x="119" y="27" width="5" height="10" rx=".8"
          fill="#222622" stroke="#343831" stroke-width=".5"/>
    <rect x="125" y="27" width="5" height="10" rx=".8"
          fill="#222622" stroke="#343831" stroke-width=".5"/>
    <rect x="131" y="27" width="5" height="10" rx=".8"
          fill="#222622" stroke="#343831" stroke-width=".5"/>
    <rect x="137" y="27" width="5" height="10" rx=".8"
          fill="#222622" stroke="#343831" stroke-width=".5"/>

    <g fill="#bdb69d" opacity=".8">
      <rect x="120" y="31" width="3" height="1.3" rx=".3"/>
      <rect x="126" y="31" width="3" height="1.3" rx=".3"/>
      <rect x="132" y="31" width="3" height="1.3" rx=".3"/>
      <rect x="138" y="31" width="3" height="1.3" rx=".3"/>
    </g>

    <g fill="#080a09" opacity=".6">
      <circle cx="121.5" cy="28.7" r=".55"/>
      <circle cx="127.5" cy="28.7" r=".55"/>
      <circle cx="133.5" cy="28.7" r=".55"/>
      <circle cx="139.5" cy="28.7" r=".55"/>
    </g>
  </g>

  <!-- Pequenas marcas de uso na chapa frontal -->
  <g fill="#c2a16e" opacity=".35">
    <circle cx="21" cy="35" r=".55"/>
    <circle cx="39" cy="39" r=".4"/>
    <circle cx="224" cy="35" r=".5"/>
    <circle cx="239" cy="30" r=".4"/>
  </g>

  <!-- Sombra inferior da gaveta -->
  <path d="M7 49.5H253"
        stroke="#120d09" stroke-opacity=".65" stroke-width="1.4"/>
  <path d="M9 51H251"
        stroke="#97714a" stroke-opacity=".22" stroke-width=".7"/>
</svg>