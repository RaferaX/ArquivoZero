
<svg xmlns="http://www.w3.org/2000/svg" width="150" height="210" viewBox="0 0 150 210">
  <defs>
    <linearGradient id="calWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#68472e"/>
      <stop offset="0.5" stop-color="#422b1c"/>
      <stop offset="1" stop-color="#24170f"/>
    </linearGradient>

    <linearGradient id="calPaper" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e0d1ad"/>
      <stop offset="0.45" stop-color="#c9b78f"/>
      <stop offset="1" stop-color="#a8956e"/>
    </linearGradient>

    <linearGradient id="calHeader" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#554033"/>
      <stop offset="1" stop-color="#302219"/>
    </linearGradient>

    <linearGradient id="calMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5a078"/>
      <stop offset="0.5" stop-color="#75603d"/>
      <stop offset="1" stop-color="#3a2d1c"/>
    </linearGradient>

    <filter id="calShadow" x="-25%" y="-15%" width="150%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Sombra na parede -->
  <rect x="13" y="8" width="128" height="194" rx="2"
    fill="#000" fill-opacity="0.6" filter="url(#calShadow)"/>

  <!-- Moldura de madeira -->
  <rect x="8" y="5" width="134" height="198" rx="2"
    fill="url(#calWood)" stroke="#1b120b" stroke-width="2"/>

  <!-- Bordas gastas da moldura -->
  <path d="M11 8H139M11 8V198"
    fill="none" stroke="#a27a4e" stroke-opacity="0.45" stroke-width="1.2"/>
  <path d="M139 9V198M12 199H138"
    fill="none" stroke="#100a06" stroke-opacity="0.8" stroke-width="1.5"/>

  <!-- Papel do calendário -->
  <rect x="17" y="14" width="116" height="181"
    fill="url(#calPaper)" stroke="#806b49" stroke-width="1"/>

  <!-- Manchas antigas do papel -->
  <g fill="#806b49" fill-opacity="0.12">
    <ellipse cx="32" cy="37" rx="9" ry="5"/>
    <ellipse cx="115" cy="68" rx="8" ry="12"/>
    <ellipse cx="37" cy="157" rx="11" ry="7"/>
    <ellipse cx="105" cy="178" rx="13" ry="5"/>
  </g>

  <!-- Cabeçalho -->
  <rect x="18" y="15" width="114" height="34" fill="url(#calHeader)"/>
  <path d="M20 17H130"
    stroke="#b09164" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Título -->
  <text x="75" y="28" text-anchor="middle"
    font-family="Georgia, serif" font-size="7.5"
    letter-spacing="1.3" fill="#c9b58a">CALENDÁRIO</text>

  <text x="75" y="43" text-anchor="middle"
    font-family="Georgia, serif" font-size="13"
    font-weight="bold" letter-spacing="2"
    fill="#e1d0a9">1994</text>

  <!-- Espiral metálica -->
  <path d="M27 14V8Q27 5 30 5Q33 5 33 8V16
           M43 14V8Q43 5 46 5Q49 5 49 8V16
           M59 14V8Q59 5 62 5Q65 5 65 8V16
           M75 14V8Q75 5 78 5Q81 5 81 8V16
           M91 14V8Q91 5 94 5Q97 5 97 8V16
           M107 14V8Q107 5 110 5Q113 5 113 8V16
           M123 14V8Q123 5 126 5Q129 5 129 8V16"
    fill="none" stroke="#17120d" stroke-width="2.6"
    stroke-linecap="round"/>

  <path d="M29 7V13M45 7V13M61 7V13M77 7V13M93 7V13M109 7V13M125 7V13"
    fill="none" stroke="#a89770" stroke-opacity="0.7" stroke-width="0.8"/>

  <!-- Mês -->
  <text x="75" y="62" text-anchor="middle"
    font-family="Georgia, serif" font-size="12"
    font-weight="bold" letter-spacing="1.5"
    fill="#38271a">OUTUBRO</text>

  <path d="M26 67H124"
    stroke="#6d5539" stroke-opacity="0.65" stroke-width="0.8"/>

  <!-- Dias da semana -->
  <g font-family="Georgia, serif" font-size="6.5"
    font-weight="bold" text-anchor="middle" fill="#493624">
    <text x="29" y="78">D</text>
    <text x="44" y="78">S</text>
    <text x="59" y="78">T</text>
    <text x="74" y="78">Q</text>
    <text x="89" y="78">Q</text>
    <text x="104" y="78">S</text>
    <text x="119" y="78">S</text>
  </g>

  <!-- Grade do calendário: outubro de 1994 começa num sábado -->
  <g stroke="#776347" stroke-opacity="0.28" stroke-width="0.55">
    <path d="M21 83H129M21 101H129M21 119H129M21 137H129M21 155H129M21 173H129"/>
    <path d="M36.4 83V173M51.8 83V173M67.2 83V173M82.6 83V173M98 83V173M113.4 83V173"/>
  </g>

  <!-- Números dos dias -->
  <g font-family="Georgia, serif" font-size="7.5"
    text-anchor="middle" fill="#332519">
    <text x="119" y="95">1</text>

    <text x="29" y="113">2</text>
    <text x="44" y="113">3</text>
    <text x="59" y="113">4</text>
    <text x="74" y="113">5</text>
    <text x="89" y="113">6</text>
    <text x="104" y="113">7</text>
    <text x="119" y="113">8</text>

    <text x="29" y="131">9</text>
    <text x="44" y="131">10</text>
    <text x="59" y="131">11</text>
    <text x="74" y="131">12</text>
    <text x="89" y="131">13</text>
    <text x="104" y="131">14</text>
    <text x="119" y="131">15</text>

    <text x="29" y="149">16</text>
    <text x="44" y="149">17</text>
    <text x="59" y="149">18</text>
    <text x="74" y="149">19</text>
    <text x="89" y="149">20</text>
    <text x="104" y="149">21</text>
    <text x="119" y="149">22</text>

    <text x="29" y="167">23</text>
    <text x="44" y="167">24</text>
    <text x="59" y="167">25</text>
    <text x="74" y="167">26</text>
    <text x="89" y="167">27</text>
    <text x="104" y="167">28</text>
    <text x="119" y="167">29</text>
  </g>

  <!-- Último dia -->
  <text x="29" y="185" text-anchor="middle"
    font-family="Georgia, serif" font-size="7.5"
    fill="#332519">30</text>
  <text x="44" y="185" text-anchor="middle"
    font-family="Georgia, serif" font-size="7.5"
    fill="#332519">31</text>

  <!-- Sinal de páginas arrancadas com cuidado -->
  <path d="M20 49L23 51L26 49L29 51L32 49L35 51L38 49L41 51L44 49L47 51L50 49L53 51L56 49L59 51L62 49L65 51L68 49L71 51L74 49L77 51L80 49L83 51L86 49L89 51L92 49L95 51L98 49L101 51L104 49L107 51L110 49L113 51L116 49L119 51L122 49L125 51L130 49"
    fill="none" stroke="#d4c39e" stroke-opacity="0.45" stroke-width="0.8"/>

  <!-- Cantos amarelados e desgastados -->
  <path d="M18 16L22 17M18 16V23M128 191L132 194"
    fill="none" stroke="#f0dfb6" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Pequenas marcas de envelhecimento -->
  <g fill="none" stroke-linecap="round">
    <path d="M22 91L26 90M115 103L121 102"
      stroke="#5a432b" stroke-opacity="0.35" stroke-width="0.7"/>
    <path d="M52 178L58 177M94 188L101 187"
      stroke="#5a432b" stroke-opacity="0.3" stroke-width="0.7"/>
  </g>
</svg>