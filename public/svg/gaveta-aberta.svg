
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="56" viewBox="0 0 260 56">
  <defs>
    <!-- Madeira envelhecida: igual à gaveta fechada -->
    <linearGradient id="drawerWoodOpen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60452f"/>
      <stop offset=".18" stop-color="#523923"/>
      <stop offset=".52" stop-color="#49301e"/>
      <stop offset="1" stop-color="#302015"/>
    </linearGradient>

    <!-- Interior profundo da gaveta -->
    <linearGradient id="drawerInteriorOpen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#100b07"/>
      <stop offset=".55" stop-color="#21160e"/>
      <stop offset="1" stop-color="#352316"/>
    </linearGradient>

    <linearGradient id="drawerSideOpen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#493321"/>
      <stop offset="1" stop-color="#24180f"/>
    </linearGradient>

    <linearGradient id="drawerBrassOpen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6a361"/>
      <stop offset=".35" stop-color="#8d6c37"/>
      <stop offset=".7" stop-color="#705127"/>
      <stop offset="1" stop-color="#49351e"/>
    </linearGradient>

    <linearGradient id="drawerMetalOpen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0bda9"/>
      <stop offset=".35" stop-color="#888a83"/>
      <stop offset=".7" stop-color="#626760"/>
      <stop offset="1" stop-color="#3e4342"/>
    </linearGradient>

    <linearGradient id="drawerShackleOpen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#535955"/>
      <stop offset=".35" stop-color="#c2bfa9"/>
      <stop offset=".65" stop-color="#8b8b7b"/>
      <stop offset="1" stop-color="#444943"/>
    </linearGradient>

    <filter id="drawerOpenShadow" x="-10%" y="-30%" width="120%" height="170%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Sombra do interior -->
  <rect x="7" y="5" width="246" height="17" rx="2"
        fill="#000" opacity=".55" filter="url(#drawerOpenShadow)"/>

  <!-- Interior escuro e vazio -->
  <path d="M6 4H254V20L246 25H14L6 20Z"
        fill="url(#drawerInteriorOpen)" stroke="#21160e" stroke-width="1"/>

  <!-- Laterais internas -->
  <path d="M7 5L17 17H243L253 5"
        fill="none" stroke="#725337" stroke-opacity=".42" stroke-width="1"/>

  <path d="M15 10H245"
        stroke="#b08a5d" stroke-opacity=".13" stroke-width=".8"/>

  <!-- Fundo escuro do interior -->
  <path d="M17 12H243L239 20H21Z"
        fill="#0a0705" opacity=".75"/>

  <!-- Frente puxada para fora -->
  <rect x="4" y="12" width="252" height="42" rx="3"
        fill="url(#drawerWoodOpen)" stroke="#281b12" stroke-width="1.2"/>

  <!-- Borda superior da madeira -->
  <path d="M7 13.5H253"
        stroke="#a17a51" stroke-opacity=".65" stroke-width="1.2"/>

  <!-- Veios da madeira -->
  <g fill="none" stroke-linecap="round">
    <path d="M10 18C34 16 54 19 77 17"
          stroke="#b18a5d" stroke-opacity=".17" stroke-width="1"/>
    <path d="M14 22C38 21 53 24 78 22"
          stroke="#21170f" stroke-opacity=".35" stroke-width="1"/>
    <path d="M184 18C206 19 229 17 249 20"
          stroke="#b18a5d" stroke-opacity=".13" stroke-width="1"/>
    <path d="M10 49C38 47 66 50 96 48"
          stroke="#1b120c" stroke-opacity=".4" stroke-width="1"/>
    <path d="M165 49C196 47 224 50 250 48"
          stroke="#1b120c" stroke-opacity=".4" stroke-width="1"/>
  </g>

  <!-- Moldura rebaixada -->
  <rect x="12" y="18" width="236" height="30" rx="2"
        fill="#382519" stroke="#2b1c12" stroke-width="1.2"/>

  <rect x="14" y="20" width="232" height="26" rx="1.5"
        fill="none" stroke="#98714a" stroke-opacity=".45" stroke-width=".8"/>

  <path d="M15 20.5H245"
        stroke="#d1aa78" stroke-opacity=".18" stroke-width=".7"/>

  <path d="M15 45.5H245"
        stroke="#100b08" stroke-opacity=".65" stroke-width="1"/>

  <!-- Puxador de latão antigo -->
  <rect x="106" y="22" width="48" height="8" rx="1.5"
        fill="url(#drawerBrassOpen)" stroke="#46331d" stroke-width=".8"/>

  <path d="M109 23.5H151"
        stroke="#ead29a" stroke-opacity=".45" stroke-width=".8"/>

  <circle cx="110" cy="26" r=".8" fill="#4d3921"/>
  <circle cx="150" cy="26" r=".8" fill="#4d3921"/>

  <!-- Cadeado aberto, deslocado para a direita -->
  <!-- Arco levantado e destravado -->
  <path d="M164 31V24C164 19.5 167 17 171 17
           C175 17 178 19.5 178 24V26"
        fill="none" stroke="#292c29" stroke-width="4"
        stroke-linecap="round"/>

  <path d="M164 30V24C164 20.3 167 18 171 18
           C174.5 18 177 20.3 177 24V26"
        fill="none" stroke="url(#drawerShackleOpen)" stroke-width="2.4"
        stroke-linecap="round"/>

  <!-- Corpo metálico do cadeado -->
  <rect x="160" y="28" width="21" height="16" rx="2.5"
        fill="#202321" opacity=".5"/>

  <rect x="160" y="27" width="21" height="16" rx="2.5"
        fill="url(#drawerMetalOpen)" stroke="#292c29" stroke-width=".9"/>

  <path d="M162 28.5H179"
        stroke="#e0d7bc" stroke-opacity=".45" stroke-width=".7"/>

  <!-- Pequena entrada da fechadura -->
  <circle cx="170.5" cy="35" r="2.2" fill="#353832"/>
  <path d="M170.5 36.5V39"
        stroke="#292c29" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Desgaste nas bordas -->
  <g fill="none" stroke-linecap="round">
    <path d="M18 19l8 .3m-3 1.4l5-.2"
          stroke="#c09a6b" stroke-opacity=".35" stroke-width=".7"/>
    <path d="M231 20l10-.5"
          stroke="#b18b5e" stroke-opacity=".3" stroke-width=".7"/>
    <path d="M19 46l12-.5"
          stroke="#b18b5e" stroke-opacity=".25" stroke-width=".7"/>
  </g>

  <!-- Sombra inferior da gaveta -->
  <path d="M7 51.5H253"
        stroke="#120d09" stroke-opacity=".65" stroke-width="1.4"/>
  <path d="M9 53H251"
        stroke="#97714a" stroke-opacity=".22" stroke-width=".7"/>
</svg>