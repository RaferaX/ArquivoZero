
<svg xmlns="http://www.w3.org/2000/svg" width="140" height="100" viewBox="0 0 140 100">
  <defs>
    <linearGradient id="az-cover" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#777461"/>
      <stop offset="0.5" stop-color="#615f4e"/>
      <stop offset="1" stop-color="#454638"/>
    </linearGradient>
    <linearGradient id="az-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3d6b5"/>
      <stop offset="1" stop-color="#b9a77e"/>
    </linearGradient>
    <linearGradient id="az-tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#918e77"/>
      <stop offset="1" stop-color="#666650"/>
    </linearGradient>
    <filter id="az-shadow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <pattern id="az-grain" width="17" height="13" patternUnits="userSpaceOnUse">
      <path d="M1 3l4-.5 M10 9l5-.7 M3 12l2-.3"
        stroke="#d6cba9" stroke-opacity=".15" stroke-width=".6"/>
      <circle cx="13" cy="3" r=".45" fill="#201f18" fill-opacity=".25"/>
    </pattern>
  </defs>

  <!-- Sombra de contato -->
  <ellipse cx="72" cy="89" rx="54" ry="5"
    fill="#000" fill-opacity=".6" filter="url(#az-shadow)"/>

  <!-- Documentos antigos -->
  <path d="M24 14 L113 11 L118 49 L28 53 Z"
    fill="url(#az-paper)" stroke="#8c7b59" stroke-width=".8"/>
  <path d="M30 23 L82 21 M30 28 L94 26"
    stroke="#75674d" stroke-width=".8" stroke-opacity=".65"/>
  <path d="M35 35 L87 33 M35 39 L75 38"
    stroke="#75674d" stroke-width=".7" stroke-opacity=".4"/>

  <!-- Aba da pasta -->
  <path d="M12 31 V23 Q12 17 18 17 H45
    Q50 17 54 22 L57 26 H121
    Q128 26 128 32 V35 H12 Z"
    fill="url(#az-tab)"/>

  <!-- Capa de papel-cartão -->
  <path d="M12 32 Q12 29 16 29 H124
    Q128 29 128 34 V81
    Q128 86 123 86 H17
    Q12 86 12 81 Z"
    fill="url(#az-cover)" stroke="#37382d" stroke-width="1"/>

  <!-- Textura e desgaste -->
  <path d="M15 34 H125 M14 40 H127 M15 80 H124"
    stroke="#d5c9a4" stroke-opacity=".16" stroke-width=".7"/>
  <rect x="12" y="29" width="116" height="57" rx="5"
    fill="url(#az-grain)"/>
  <path d="M15 35l4-3 M121 33l4 3 M16 81l4 3 M122 83l3-3"
    stroke="#c2b28b" stroke-opacity=".65" stroke-width="1.1"
    stroke-linecap="round"/>
  <path d="M18 46l9-1 M111 69l8-2 M28 78l5-1"
    stroke="#292b20" stroke-opacity=".35" stroke-width=".8"/>

  <!-- Etiqueta datilografada -->
  <path d="M37 43 L103 42 L105 61 L38 63 Z"
    fill="#d4c7a6" stroke="#a39779" stroke-width=".8"/>
  <path d="M40 46l3-1 M98 59l3-1"
    stroke="#8e8266" stroke-width=".8"/>

  <text x="71" y="51.5" text-anchor="middle"
    font-family="Courier New, monospace"
    font-size="6.2" font-weight="bold" letter-spacing=".6"
    fill="#39372c">ARQUIVO ZERO</text>
  <path d="M46 54.5 H96"
    stroke="#766c55" stroke-width=".6"/>

  <text x="71" y="59" text-anchor="middle"
    font-family="Courier New, monospace"
    font-size="4.5" letter-spacing=".8"
    fill="#494638">CASO Nº 000</text>

  <!-- Numeração original preservada -->
  <text x="70" y="77" text-anchor="middle"
    font-family="Courier New, monospace"
    font-size="12" font-weight="bold" letter-spacing="4"
    fill="#25271e" fill-opacity=".8"
    transform="rotate(-3 70 74)">000</text>

  <!-- Reflexo discreto na borda -->
  <path d="M17 30 H122"
    stroke="#d5cdb0" stroke-opacity=".3"
    stroke-width=".8" stroke-linecap="round"/>
</svg>