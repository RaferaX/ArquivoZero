<svg xmlns="http://www.w3.org/2000/svg" width="104" height="104" viewBox="0 0 104 104">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c27a"/>
      <stop offset="0.5" stop-color="#a8843f"/>
      <stop offset="1" stop-color="#6a501f"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4529"/>
      <stop offset="1" stop-color="#2a1a0f"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#dff1ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fa6c6" stop-opacity="0.18"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>

  <ellipse cx="54" cy="94" rx="34" ry="4" fill="#000" fill-opacity="0.5" filter="url(#soft)"/>

  <!-- cabo -->
  <rect x="60" y="56" width="44" height="11" rx="5.5" fill="url(#handle)" transform="rotate(45 60 61.5)"/>
  <rect x="53" y="54" width="12" height="15" rx="2.5" fill="url(#rim)" transform="rotate(45 60 61.5)"/>

  <!-- lente -->
  <circle cx="40" cy="40" r="26" fill="url(#glass)"/>
  <circle cx="40" cy="40" r="26" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <circle cx="40" cy="40" r="23" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="1"/>
  <path d="M24 35A18 18 0 0 1 36 23" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
</svg>